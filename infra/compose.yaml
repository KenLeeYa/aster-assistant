name: ky-jarvis

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-bookworm@sha256:2ac2c62ac8f030b414b19ea633a6d1d4d37c03abe52ce91887a4e5b4fbb5c73c
    profiles: ["core"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_DB: ky_jarvis
      POSTGRES_USER: ky_jarvis
      POSTGRES_PASSWORD: ${KY_JARVIS_DB_PASSWORD-}
      POSTGRES_PASSWORD_FILE: ${KY_JARVIS_DB_PASSWORD_FILE_CONTAINER-/run/secrets/postgres_password}
    secrets:
      - postgres_password
    volumes:
      - ky_jarvis_postgres_data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ky_jarvis -d ky_jarvis"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ${KY_JARVIS_DB_PASSWORD_FILE:?Set KY_JARVIS_DB_PASSWORD_FILE to a confirmed local secret file}

volumes:
  ky_jarvis_postgres_data:
    name: ky_jarvis_postgres_data
